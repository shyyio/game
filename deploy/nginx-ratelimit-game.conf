limit_req_zone $binary_remote_addr zone=status_zone:10m rate=1r/s;
limit_req_zone $binary_remote_addr zone=ws_connect_zone:10m rate=1r/s;
# A joining client downloads one file per mod plus its atlases, all at once, and the files are
# immutable so it only does that once per loadout.
limit_req_zone $binary_remote_addr zone=mods_zone:10m rate=10r/s;
