limit_req_zone $binary_remote_addr zone=reporting_write_zone:10m rate=5r/m;
# 1r/m is nginx's coarsest rate — the closest a plain limit_req can get to a per-IP daily cap.
limit_req_zone $binary_remote_addr zone=reporting_write_daily_zone:10m rate=1r/m;
limit_req_zone $binary_remote_addr zone=reporting_admin_zone:10m rate=30r/m;
