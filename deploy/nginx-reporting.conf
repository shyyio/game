server {
    listen 80;
    listen [::]:80;
    server_name {{REPORTING_DOMAIN}};
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name {{REPORTING_DOMAIN}};

    ssl_certificate     /etc/letsencrypt/live/{{REPORTING_DOMAIN}}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/{{REPORTING_DOMAIN}}/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    server_tokens off;
    more_clear_headers "Server";
    proxy_hide_header Uwebsockets;
    limit_req_status 429;
    # nginx defaults proxy_pass to HTTP/1.0; uWS refuses it outright.
    proxy_http_version 1.1;
    # Field caps are enforced app-side too; this just stops an oversized body before it's read.
    client_max_body_size 32k;

    # Anonymous, unauthenticated ingest — rate-limited per IP against flooding.
    location = /report {
        limit_req zone=reporting_write_zone burst=10 nodelay;
        error_page 429 = @write_rate_limited;
        proxy_pass http://127.0.0.1:27502;
        proxy_set_header Host $host;
    }

    location @write_rate_limited {
        add_header Retry-After 12 always;
        add_header Access-Control-Allow-Origin "*" always;
        return 429;
    }

    # Admin browse UI: no app-level auth, gated here instead.
    location /admin {
        auth_basic "reportingserver admin";
        auth_basic_user_file /etc/nginx/spup-reporting.htpasswd;
        proxy_pass http://127.0.0.1:27502;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://127.0.0.1:27502;
        proxy_set_header Host $host;
    }
}
