server {
    listen 80;
    listen [::]:80;
    server_name {{AUTH_DOMAIN}};
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name {{AUTH_DOMAIN}};

    ssl_certificate     /etc/letsencrypt/live/{{AUTH_DOMAIN}}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/{{AUTH_DOMAIN}}/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    server_tokens off;
    more_clear_headers "Server";
    proxy_hide_header Uwebsockets;
    limit_req_status 429;
    limit_conn_status 429;
    # nginx defaults proxy_pass to HTTP/1.0; uWS refuses it outright.
    proxy_http_version 1.1;

    # Every endpoint takes a small JSON body or none; the cap is what stops a slow drip of a
    # large one from holding a worker.
    client_max_body_size 8k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 10s;
    keepalive_timeout 30s;

    # limit_req caps requests, which leaves sockets: a slowloris opens many and sends nothing.
    # Set high enough that a carrier-NAT'd block of players stays under it.
    limit_conn auth_conn_zone 50;

    # Mutating/costly: account creation on login, signs a join token per request.
    location ~ ^/(login|join)$ {
        limit_req zone=auth_write_zone burst=10 nodelay;
        error_page 429 = @write_rate_limited;
        proxy_pass http://127.0.0.1:27501;
        proxy_set_header Host $host;
    }

    location = /rejoin {
        limit_req zone=auth_rejoin_zone burst=20 nodelay;
        error_page 429 = @write_rate_limited;
        proxy_pass http://127.0.0.1:27501;
        proxy_set_header Host $host;
    }

    location @write_rate_limited {
        add_header Retry-After 6 always;
        add_header Access-Control-Allow-Origin "*" always;
        return 429;
    }

    # Cheap reads, polled once per server-list row on every page load.
    location ~ ^/(servers|\.well-known/jwks\.json)$ {
        limit_req zone=auth_read_zone burst=10 nodelay;
        error_page 429 = @read_rate_limited;
        proxy_pass http://127.0.0.1:27501;
        proxy_set_header Host $host;
    }

    location @read_rate_limited {
        add_header Retry-After 1 always;
        add_header Access-Control-Allow-Origin "*" always;
        return 429;
    }

    location / {
        proxy_pass http://127.0.0.1:27501;
        proxy_set_header Host $host;
    }
}
