#!/usr/sbin/nft -f

flush ruleset

table inet filter {
    chain input {
        type filter hook input priority 0; policy drop;

        ct state established,related accept
        ct state invalid drop

        iif lo accept

        icmp type echo-request accept
        icmpv6 type { echo-request, nd-neighbor-solicit, nd-neighbor-advert, nd-router-solicit, nd-router-advert } accept

        tcp dport 22 ct state new limit rate 5/minute accept

        # Backstop under nginx's own limit_conn: caps concurrent sockets from one source so a
        # connection flood can't exhaust the worker pool. Generous, since carrier NAT puts many
        # real players behind one address.
        tcp dport { 80, 443 } ct state new meter http-conn4 { ip saddr ct count over 200 } drop
        tcp dport { 80, 443 } ct state new meter http-conn6 { ip6 saddr ct count over 200 } drop

        tcp dport { 80, 443 } accept
    }

    chain forward {
        type filter hook forward priority 0; policy drop;
    }

    chain output {
        type filter hook output priority 0; policy accept;
    }
}
