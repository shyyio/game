server {
    listen 80;
    listen [::]:80;
    server_name {{DOMAIN}};
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name {{DOMAIN}};

    ssl_certificate     /etc/letsencrypt/live/{{DOMAIN}}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/{{DOMAIN}}/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    server_tokens off;
    more_clear_headers "Server";
    proxy_hide_header Uwebsockets;
    limit_req_status 429;
    # nginx defaults proxy_pass to HTTP/1.0; uWS refuses it outright.
    proxy_http_version 1.1;

    location /status {
        limit_req zone=status_zone burst=10 nodelay;
        error_page 429 = @status_rate_limited;
        proxy_pass http://127.0.0.1:27500;
        proxy_set_header Host $host;
    }

    location @status_rate_limited {
        add_header Retry-After 1 always;
        return 429;
    }

    # The server's own mod packages: content-addressed, immutable, fetched in a burst by every
    # joining client.
    location /mods/ {
        limit_req zone=mods_zone burst=60 nodelay;
        error_page 429 = @mods_rate_limited;
        proxy_pass http://127.0.0.1:27500;
        proxy_set_header Host $host;
    }

    location @mods_rate_limited {
        add_header Retry-After 1 always;
        return 429;
    }

    # Everything else: the plain-text info screen for browsers, and the game's websocket
    # upgrade — uWS routes both off "/*" itself, so one location covers them.
    # limit_req only gates the upgrade request, not in-game traffic after the handshake.
    location / {
        limit_req zone=ws_connect_zone burst=20 nodelay;
        error_page 429 = @ws_rate_limited;
        proxy_pass http://127.0.0.1:27500;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # nginx's 60s default would cut idle in-game websockets; give them room.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location @ws_rate_limited {
        add_header Retry-After 1 always;
        return 429;
    }
}
