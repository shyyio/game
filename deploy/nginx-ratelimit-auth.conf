# One key per client: IPv4 keys on the address, IPv6 on the /64 a subscriber owns, so a single
# prefix cannot spend a fresh limit on every one of its 2^64 addresses. The three IPv6 forms
# are, in order: the network half spelled out, "::" swallowing it (all trailing hextets are the
# interface half), and "::" inside it (everything but the last four hextets).
map $remote_addr $auth_client_key {
    default $binary_remote_addr;
    "~^(?<p>([0-9a-f]{1,4}:){3}[0-9a-f]{1,4}):" $p;
    "~^(?<p>[0-9a-f:]*::)([0-9a-f]{1,4}(:[0-9a-f]{1,4}){0,3})?$" $p;
    "~^(?<p>[0-9a-f:]*::([0-9a-f]{1,4}:)*)[0-9a-f]{1,4}(:[0-9a-f]{1,4}){3}$" $p;
}

# A CORS preflight is unauthenticated and does no work; an empty key exempts it.
map $request_method $auth_write_key {
    default $auth_client_key;
    OPTIONS "";
}

limit_req_zone $auth_write_key zone=auth_write_zone:10m rate=10r/m;
# Every player of a restarted game server comes back through /rejoin at once, at 2/min each.
limit_req_zone $auth_write_key zone=auth_rejoin_zone:10m rate=1r/s;
limit_req_zone $auth_client_key zone=auth_read_zone:10m rate=3r/s;
limit_conn_zone $auth_client_key zone=auth_conn_zone:10m;
